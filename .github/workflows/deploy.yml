# PUBLICACIÓN: en cada push a main, compila el sitio y publica dist/ con GitHub Pages en
# https://berthaestrada.github.io/berthaestrada/
# Configuración única: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # compile y no build: build también abre la vista previa, que aquí se quedaría esperando
      - name: Compilar (minificado + ofuscado)
        run: npm run compile

      - name: Comprobar dist/ (rutas y archivos de desarrollo)
        run: npm run check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
